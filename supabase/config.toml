
[functions.google-drive]
enabled = true
verify_jwt = true
import_map = "./functions/google-drive/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/google-drive/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/google-drive/*.html" ]

[functions.asaas]
enabled = true
# false porque o webhook do Asaas chama essa function sem sessao do Supabase —
# a autenticacao e feita dentro do proprio codigo (sessao do usuario para as
# acoes normais, token do webhook para /asaas/webhook).
verify_jwt = false
entrypoint = "./functions/asaas/index.ts"
